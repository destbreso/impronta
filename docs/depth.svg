</style><text x="16" y="24" class="f-fg" fill="#1c1f26" font-size="14" font-weight="700">Nesting depth before failure</text><text x="16" y="42" class="f-muted" fill="#6b7280" font-size="11">Recursive kernels die in the low thousands. Stack limits vary by run, so read these as orders of magnitude.</text><defs><linearGradient id="sc-unbounded" x1="0" x2="1"><stop offset="0" class="p-accent" stop-color="#1a7f4b" stop-opacity="1"/><stop offset="1" class="p-accent" stop-color="#1a7f4b" stop-opacity="0.2"/></linearGradient></defs><text x="216" y="85" class="f-fg" fill="#1c1f26" font-size="11" text-anchor="end">canonicalize</text><rect x="224" y="72" width="420" height="16" rx="2" fill="url(#sc-unbounded)"/><path d="M 648 76 L 657 81 L 648 86 Z" class="f-accent" fill="#1a7f4b"/><text x="662" y="85" class="f-accent" fill="#1a7f4b" font-size="11">unbounded</text><text x="216" y="115" class="f-fg" fill="#1c1f26" font-size="11" text-anchor="end">json-canonicalize</text><rect x="224" y="102" width="420" height="16" rx="2" fill="url(#sc-unbounded)"/><path d="M 648 106 L 657 111 L 648 116 Z" class="f-accent" fill="#1a7f4b"/><text x="662" y="115" class="f-accent" fill="#1a7f4b" font-size="11">unbounded</text><text x="216" y="145" class="f-fg" fill="#1c1f26" font-size="11" text-anchor="end">safe-stable-stringify</text><rect x="224" y="132" width="420" height="16" rx="2" fill="url(#sc-unbounded)"/><path d="M 648 136 L 657 141 L 648 146 Z" class="f-accent" fill="#1a7f4b"/><text x="662" y="145" class="f-accent" fill="#1a7f4b" font-size="11">unbounded</text><text x="216" y="175" class="f-fg" fill="#1c1f26" font-size="11" text-anchor="end">fast-json-stable-stringify</text><rect x="224" y="162" width="420" height="16" rx="2" fill="url(#sc-unbounded)"/><path d="M 648 166 L 657 171 L 648 176 Z" class="f-accent" fill="#1a7f4b"/><text x="662" y="175" class="f-accent" fill="#1a7f4b" font-size="11">unbounded</text><text x="216" y="205" class="f-fg" fill="#1c1f26" font-size="11" text-anchor="en